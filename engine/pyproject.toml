[project]
name = "model3d-engine"
version = "0.1.0"
description = "Local GPU engine that turns an image into a textured GLB with Hunyuan3D 2.1."
requires-python = "==3.11.*"
dependencies = [
    # PyTorch built for CUDA 13.0: RTX 5070 (sm_120) needs CUDA 12.8 or newer, and the
    # compiled paint extensions must match the CUDA major version of nvcc 13.1.
    "torch==2.9.1",
    "torchvision==0.24.1",
    # Hunyuan3D 2.1 inference dependencies, pinned to the versions upstream tests.
    "transformers==4.46.0",
    "diffusers==0.30.0",
    "accelerate==1.1.1",
    "huggingface-hub==0.30.2",
    "safetensors==0.4.4",
    "einops==0.8.0",
    "omegaconf==2.3.0",
    "pyyaml==6.0.2",
    "tqdm==4.66.5",
    "numpy==1.26.4",  # upstream pins 1.24.4, but bpy 4.5 needs >=1.26,<2
    "scipy==1.14.1",
    "opencv-python-headless==4.10.0.84",
    "scikit-image==0.24.0",
    "rembg==2.0.65",
    "onnxruntime>=1.20",  # upstream pins 1.16.3, whose library needs an executable stack that glibc 2.41+ refuses
    "timm",
    "trimesh==4.4.7",  # upstream calls simplify_quadric_decimation(face_count) positionally; 5.x reads it as a percent
    "open3d==0.18.0",  # trimesh 4.4.7 decimates through open3d
    "pymeshlab==2022.2.post3",
    "pygltflib==1.16.3",
    "xatlas==0.0.9",
    "pytorch-lightning==1.9.5",
    "realesrgan==0.3.0",
    "basicsr==1.4.2",
    # The paint pipeline imports bpy to convert OBJ to GLB; bpy wheels exist for cp311 only.
    "bpy==4.5.*",
    # Build tools for custom_rasterizer and mesh_inpaint_processor.
    "pybind11",
    "ninja",
    # pytorch-lightning 1.9.5 imports pkg_resources, which newer setuptools removed.
    "setuptools<81",
    "wheel",
    # Compiled against the installed torch; needs nvcc (CUDA_HOME) at sync time.
    "custom-rasterizer",
    # Engine API.
    "model3d-contracts",
    "fastapi==0.115.12",
    "uvicorn==0.34.3",
    "python-multipart",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model3d_engine"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
no-build-isolation-package = ["basicsr", "custom-rasterizer"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
custom-rasterizer = { path = "../vendor/Hunyuan3D-2.1/hy3dpaint/custom_rasterizer" }
model3d-contracts = { path = "../contracts", editable = true }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs both RTX 5070 GPUs and the full engine environment"]
addopts = "-m 'not gpu'"
