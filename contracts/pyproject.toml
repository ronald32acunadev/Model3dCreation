[project]
name = "model3d-contracts"
version = "0.1.0"
description = "Job and event models shared by the model3d engine and its clients."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model3d_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
