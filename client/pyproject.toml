[project]
name = "model3d-client"
version = "0.1.0"
description = "PySide6 desktop app for the local model3d engine."
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.12.0",
    "pydantic>=2.10,<3",
    "model3d-contracts",
]

[dependency-groups]
# fastapi and uvicorn run a fake engine in the tests.
dev = ["pytest", "pytest-qt", "fastapi", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model3d_client"]

[tool.uv.sources]
model3d-contracts = { path = "../contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "webengine: needs QtWebEngine with a real display and GPU-backed rendering",
    "gpu: needs the real engine and its GPUs",
]
addopts = "-m 'not webengine and not gpu'"
